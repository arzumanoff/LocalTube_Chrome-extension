name: Release Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest
    env:
      MEDIA_ENGINE_STDOUT_DIAGNOSTIC: '1'
      MEDIA_ENGINE_VIDEO_ENCODER: 'software'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: native-host/requirements.txt

      # ── Install Inno Setup ──────────────────────────────────────────
      - name: Install Inno Setup
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $Installer = Join-Path $env:RUNNER_TEMP 'innosetup.exe'
          & curl.exe -L --fail --retry 3 --output $Installer `
            'https://github.com/jrsoftware/issrc/releases/download/is-6_3_3/innosetup-6.3.3.exe'
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup download failed.' }
          Start-Process -FilePath $Installer -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-','/DIR=C:\innosetup' -Wait -NoNewWindow
          if (-not (Test-Path 'C:\innosetup\ISCC.exe')) { throw 'Inno Setup installation failed.' }
          echo "ISCC_EXE=C:\innosetup\ISCC.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & 'C:\innosetup\ISCC.exe' /? 2>&1 | Select-Object -First 3

      # ── Tests ────────────────────────────────────────────────────────
      - name: Test and lint
        run: |
          npm ci --no-audit --no-fund --ignore-scripts
          npm test
          npm run test:host
          npm run check

      # ── Build Native Host ────────────────────────────────────────────
      - name: Build Native Host
        shell: powershell
        run: ./native-host/build_host.ps1

      - name: Smoke built executable
        run: python native-host/tests/smoke_built_host.py native-host/dist/media-engine-host.exe

      # ── Download runtime tools ───────────────────────────────────────
      - name: Download FFmpeg, FFprobe and Deno
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $Downloads = Join-Path $env:RUNNER_TEMP 'media-engine-downloads'
          $Tools = Join-Path $PWD 'native-host\tools'
          New-Item -ItemType Directory -Path $Downloads -Force | Out-Null
          New-Item -ItemType Directory -Path $Tools -Force | Out-Null

          $FfmpegZip = Join-Path $Downloads 'ffmpeg.zip'
          & curl.exe -L --fail --retry 5 --retry-delay 2 --output $FfmpegZip `
            'https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip'
          if ($LASTEXITCODE -ne 0) { throw 'FFmpeg download failed.' }
          $FfmpegExtract = Join-Path $Downloads 'ffmpeg'
          Expand-Archive -Path $FfmpegZip -DestinationPath $FfmpegExtract -Force
          $FfmpegExe = Get-ChildItem $FfmpegExtract -Recurse -Filter 'ffmpeg.exe' | Select-Object -First 1
          $FfprobeExe = Get-ChildItem $FfmpegExtract -Recurse -Filter 'ffprobe.exe' | Select-Object -First 1
          Copy-Item $FfmpegExe.FullName (Join-Path $Tools 'ffmpeg.exe') -Force
          Copy-Item $FfprobeExe.FullName (Join-Path $Tools 'ffprobe.exe') -Force

          $DenoZip = Join-Path $Downloads 'deno.zip'
          & curl.exe -L --fail --retry 5 --retry-delay 2 --output $DenoZip `
            'https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip'
          if ($LASTEXITCODE -ne 0) { throw 'Deno download failed.' }
          $DenoExtract = Join-Path $Downloads 'deno'
          Expand-Archive -Path $DenoZip -DestinationPath $DenoExtract -Force
          $DenoExe = Get-ChildItem $DenoExtract -Recurse -Filter 'deno.exe' | Select-Object -First 1
          Copy-Item $DenoExe.FullName (Join-Path $Tools 'deno.exe') -Force

          Write-Host "FFmpeg: $(& (Join-Path $Tools 'ffmpeg.exe') -version | Select-Object -First 1)"
          Write-Host "FFprobe: $(& (Join-Path $Tools 'ffprobe.exe') -version | Select-Object -First 1)"
          Write-Host "Deno: $(& (Join-Path $Tools 'deno.exe') --version | Select-Object -First 1)"

      # ── Package extension ────────────────────────────────────────────
      - name: Package Chrome extension
        shell: powershell
        run: |
          $ExtensionDir = Join-Path $PWD 'release\extension'
          Remove-Item 'release' -Recurse -Force -ErrorAction SilentlyContinue
          node scripts/package-extension.mjs $ExtensionDir
          Get-ChildItem $ExtensionDir -Recurse | Select-Object FullName, Length

      # ── Read version ─────────────────────────────────────────────────
      - name: Read version
        shell: powershell
        run: |
          $Manifest = Get-Content manifest.json -Raw | ConvertFrom-Json
          $Version = $Manifest.version
          Write-Host "Extension version: $Version"
          echo "EXT_VERSION=$Version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # ── Build installer with Inno Setup ───────────────────────────────
      - name: Compile installer
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $InstallerDir = Join-Path $PWD 'release\installer'
          New-Item -ItemType Directory -Path $InstallerDir -Force | Out-Null

          & $env:ISCC_EXE `
            /DAppVersion=$env:EXT_VERSION `
            /DSourcePath="$PWD" `
            /O"$InstallerDir" `
            scripts\setup.iss

          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup compilation failed.' }
          Get-ChildItem $InstallerDir | Select-Object Name, Length

      # ── Upload installer artifact ────────────────────────────────────
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: LocalTube-Setup-${{ env.EXT_VERSION }}
          path: release/installer/*.exe
          if-no-files-found: error
          retention-days: 30

      # ── Create GitHub Release ────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "LocalTube v${{ env.EXT_VERSION }}"
          body: |
            ## LocalTube v${{ env.EXT_VERSION }}

            Chrome-расширение с Native Messaging движком для скачивания YouTube-видео в реальном качестве.

            ### Что нового
            См. [CHANGELOG](https://github.com/arzumanoff/LocalTube_Chrome-extension/commits/main)

            ### Установка
            1. Скачайте и запустите `LocalTube-Setup.exe`
            2. Установщик настроит движок и определит ваш видеоэнкодер
            3. Загрузите расширение: `chrome://extensions` → Режим разработчика → Загрузить распакованное → папка `расширение`
            4. Откройте YouTube, нажмите Ctrl+F5

            ### Системные требования
            - Windows 10/11 x64
            - Google Chrome 120+

            ### Исходный код
            https://github.com/arzumanoff/LocalTube_Chrome-extension
          files: release/installer/*.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}