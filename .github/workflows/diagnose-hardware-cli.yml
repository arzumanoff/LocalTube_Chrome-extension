name: Diagnose Hardware CLI

on:
  push:
    branches: ['feat/native-engine-mvp']
  pull_request:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-latest
    env:
      MEDIA_ENGINE_VIDEO_ENCODER: 'software'
      MEDIA_ENGINE_STDOUT_DIAGNOSTIC: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: native-host/requirements.txt

      - name: Build Native Host
        shell: powershell
        run: ./native-host/build_host.ps1

      - name: Download FFmpeg
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $Downloads = Join-Path $env:RUNNER_TEMP 'hardware-cli-downloads'
          $Extract = Join-Path $Downloads 'ffmpeg'
          New-Item -ItemType Directory -Path $Downloads -Force | Out-Null
          $Zip = Join-Path $Downloads 'ffmpeg.zip'
          & curl.exe -L --fail --retry 5 --retry-delay 2 --output $Zip `
            'https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip'
          if ($LASTEXITCODE -ne 0) { throw 'FFmpeg download failed.' }
          Expand-Archive -Path $Zip -DestinationPath $Extract -Force
          $Ffmpeg = Get-ChildItem $Extract -Recurse -Filter 'ffmpeg.exe' | Select-Object -First 1
          if (-not $Ffmpeg) { throw 'ffmpeg.exe not found.' }
          $InstallDir = Join-Path $env:LOCALAPPDATA 'ArzumanoffMediaEngine'
          New-Item -ItemType Directory -Path $InstallDir -Force | Out-Null
          Copy-Item 'native-host\dist\media-engine-host.exe' (Join-Path $InstallDir 'media-engine-host.exe') -Force
          Copy-Item $Ffmpeg.FullName (Join-Path $InstallDir 'ffmpeg.exe') -Force

      - name: Reproduce installer detection and JSON parsing
        id: detect
        continue-on-error: true
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $Diagnostic = Join-Path $PWD 'hardware-cli-diagnostic.txt'
          $InstallDir = Join-Path $env:LOCALAPPDATA 'ArzumanoffMediaEngine'
          $HostExe = Join-Path $InstallDir 'media-engine-host.exe'
          $ProfilePath = Join-Path $InstallDir 'hardware-profile.json'
          try {
            $StartInfo = New-Object System.Diagnostics.ProcessStartInfo
            $StartInfo.FileName = $HostExe
            $StartInfo.Arguments = '--detect-hardware'
            $StartInfo.UseShellExecute = $false
            $StartInfo.CreateNoWindow = $true
            $StartInfo.RedirectStandardOutput = $true
            $StartInfo.RedirectStandardError = $true
            $Process = New-Object System.Diagnostics.Process
            $Process.StartInfo = $StartInfo
            if (-not $Process.Start()) { throw 'Failed to start hardware CLI.' }
            $Stdout = $Process.StandardOutput.ReadToEnd()
            $Stderr = $Process.StandardError.ReadToEnd()
            $Process.WaitForExit()
            $Code = $Process.ExitCode
            $Parsed = $null
            $ParseError = ''
            try {
              $Parsed = $Stdout.Trim() | ConvertFrom-Json
            } catch {
              $ParseError = ($_ | Out-String)
            }
            @(
              "exitCode=$Code"
              "profileExists=$(Test-Path $ProfilePath)"
              "parsed=$($null -ne $Parsed)"
              "encoderKey=$($Parsed.encoderKey)"
              "status=$($Parsed.status)"
              'parseError:'
              $ParseError
              'stdout:'
              $Stdout
              'stderr:'
              $Stderr
            ) | Set-Content -Path $Diagnostic -Encoding utf8
            Get-Content $Diagnostic
            if ($Code -ne 0) { throw "Detection exited with $Code" }
            if ($null -eq $Parsed) { throw 'Detection output is not valid JSON.' }
            if (-not (Test-Path $ProfilePath)) { throw 'Profile file was not created.' }
          } catch {
            if (-not (Test-Path $Diagnostic)) {
              ($_ | Out-String) | Set-Content -Path $Diagnostic -Encoding utf8
            } else {
              Add-Content -Path $Diagnostic -Value @('', 'stepException:', ($_ | Out-String))
            }
            throw
          }

      - name: Upload hardware CLI diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hardware-cli-diagnostic
          path: hardware-cli-diagnostic.txt
          if-no-files-found: error
          retention-days: 2

      - name: Fail when detection failed
        if: steps.detect.outcome == 'failure'
        shell: powershell
        run: throw 'Hardware CLI diagnostic failed; inspect uploaded artifact.'
