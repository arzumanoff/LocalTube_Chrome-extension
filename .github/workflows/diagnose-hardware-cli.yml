name: Diagnose Hardware CLI

on:
  push:
    branches: ['feat/native-engine-mvp']
  pull_request:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-latest
    env:
      MEDIA_ENGINE_VIDEO_ENCODER: 'software'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: native-host/requirements.txt

      - name: Build Native Host
        shell: powershell
        run: ./native-host/build_host.ps1

      - name: Download FFmpeg
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $Downloads = Join-Path $env:RUNNER_TEMP 'hardware-cli-downloads'
          $Extract = Join-Path $Downloads 'ffmpeg'
          New-Item -ItemType Directory -Path $Downloads -Force | Out-Null
          $Zip = Join-Path $Downloads 'ffmpeg.zip'
          & curl.exe -L --fail --retry 5 --retry-delay 2 --output $Zip `
            'https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip'
          if ($LASTEXITCODE -ne 0) { throw 'FFmpeg download failed.' }
          Expand-Archive -Path $Zip -DestinationPath $Extract -Force
          $Ffmpeg = Get-ChildItem $Extract -Recurse -Filter 'ffmpeg.exe' | Select-Object -First 1
          if (-not $Ffmpeg) { throw 'ffmpeg.exe not found.' }
          Copy-Item $Ffmpeg.FullName 'native-host\dist\ffmpeg.exe' -Force

      - name: Run detection and capture complete output
        id: detect
        continue-on-error: true
        shell: powershell
        run: |
          $Diagnostic = Join-Path $env:RUNNER_TEMP 'hardware-cli-diagnostic.txt'
          $Profile = Join-Path $env:RUNNER_TEMP 'hardware-profile.json'
          $env:MEDIA_ENGINE_HARDWARE_PROFILE = $Profile
          $Output = (& 'native-host\dist\media-engine-host.exe' --detect-hardware 2>&1 | Out-String)
          $Code = $LASTEXITCODE
          @(
            "exitCode=$Code"
            "profileExists=$(Test-Path $Profile)"
            'stdoutAndStderr:'
            $Output
          ) | Set-Content -Path $Diagnostic -Encoding utf8
          Get-Content $Diagnostic
          if ($Code -ne 0) { exit $Code }

      - name: Upload hardware CLI diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hardware-cli-diagnostic
          path: ${{ runner.temp }}/hardware-cli-diagnostic.txt
          if-no-files-found: error
          retention-days: 2

      - name: Fail when detection failed
        if: steps.detect.outcome == 'failure'
        shell: powershell
        run: throw 'Hardware CLI diagnostic failed; inspect uploaded artifact.'
