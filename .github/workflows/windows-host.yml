name: Windows Native Host

on:
  push:
    branches: [main, 'feat/**']
  pull_request:

permissions:
  contents: read

jobs:
  build-and-smoke:
    runs-on: windows-latest
    env:
      MEDIA_ENGINE_STDOUT_DIAGNOSTIC: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: native-host/requirements.txt

      - name: Build Native Host
        shell: powershell
        run: ./native-host/build_host.ps1

      - name: Smoke built executable
        run: python native-host/tests/smoke_built_host.py native-host/dist/media-engine-host.exe

      - name: Download FFmpeg, FFprobe and Deno
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $Downloads = Join-Path $env:RUNNER_TEMP 'media-engine-downloads'
          $Tools = Join-Path $PWD 'native-host\tools'
          New-Item -ItemType Directory -Path $Downloads -Force | Out-Null
          New-Item -ItemType Directory -Path $Tools -Force | Out-Null

          $FfmpegZip = Join-Path $Downloads 'ffmpeg.zip'
          & curl.exe -L --fail --retry 5 --retry-delay 2 --output $FfmpegZip `
            'https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip'
          if ($LASTEXITCODE -ne 0) { throw 'FFmpeg download failed.' }
          $FfmpegExtract = Join-Path $Downloads 'ffmpeg'
          Expand-Archive -Path $FfmpegZip -DestinationPath $FfmpegExtract -Force
          $FfmpegExe = Get-ChildItem $FfmpegExtract -Recurse -Filter 'ffmpeg.exe' | Select-Object -First 1
          $FfprobeExe = Get-ChildItem $FfmpegExtract -Recurse -Filter 'ffprobe.exe' | Select-Object -First 1
          if (-not $FfmpegExe -or -not $FfprobeExe) {
            throw 'FFmpeg archive does not contain ffmpeg.exe and ffprobe.exe.'
          }
          Copy-Item $FfmpegExe.FullName (Join-Path $Tools 'ffmpeg.exe') -Force
          Copy-Item $FfprobeExe.FullName (Join-Path $Tools 'ffprobe.exe') -Force

          $DenoZip = Join-Path $Downloads 'deno.zip'
          & curl.exe -L --fail --retry 5 --retry-delay 2 --output $DenoZip `
            'https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip'
          if ($LASTEXITCODE -ne 0) { throw 'Deno download failed.' }
          $DenoExtract = Join-Path $Downloads 'deno'
          Expand-Archive -Path $DenoZip -DestinationPath $DenoExtract -Force
          $DenoExe = Get-ChildItem $DenoExtract -Recurse -Filter 'deno.exe' | Select-Object -First 1
          if (-not $DenoExe) { throw 'Deno archive does not contain deno.exe.' }
          Copy-Item $DenoExe.FullName (Join-Path $Tools 'deno.exe') -Force

          & (Join-Path $Tools 'ffmpeg.exe') -version | Select-Object -First 1
          & (Join-Path $Tools 'ffprobe.exe') -version | Select-Object -First 1
          & (Join-Path $Tools 'deno.exe') --version | Select-Object -First 1

      - name: Assemble extension and engine package
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $ReleaseDir = Join-Path $PWD 'native-host\release'
          $PackageRoot = Join-Path $ReleaseDir 'media-engine-test-package'
          $EngineDir = Join-Path $PackageRoot 'engine'
          $ExtensionDir = Join-Path $PackageRoot 'extension'

          Remove-Item $ReleaseDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path (Join-Path $EngineDir 'dist') -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $EngineDir 'tools') -Force | Out-Null

          Copy-Item 'native-host\dist\media-engine-host.exe' (Join-Path $EngineDir 'dist\media-engine-host.exe') -Force
          Copy-Item 'native-host\tools\ffmpeg.exe' (Join-Path $EngineDir 'tools\ffmpeg.exe') -Force
          Copy-Item 'native-host\tools\ffprobe.exe' (Join-Path $EngineDir 'tools\ffprobe.exe') -Force
          Copy-Item 'native-host\tools\deno.exe' (Join-Path $EngineDir 'tools\deno.exe') -Force
          Copy-Item 'native-host\install_host.ps1' $EngineDir -Force
          Copy-Item 'native-host\uninstall_host.ps1' $EngineDir -Force
          Copy-Item 'native-host\INSTALL_ENGINE.cmd' $EngineDir -Force
          Copy-Item 'native-host\UNINSTALL_ENGINE.cmd' $EngineDir -Force
          Copy-Item 'native-host\TEST_PACKAGE_README.txt' (Join-Path $PackageRoot 'README.txt') -Force

          node scripts/package-extension.mjs $ExtensionDir

          @(
            "Package commit: $env:GITHUB_SHA"
            'FFmpeg source: https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip'
            'Deno source: https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip'
          ) | Set-Content -Path (Join-Path $PackageRoot 'VERSIONS.txt') -Encoding utf8

          Get-ChildItem $PackageRoot -Recurse | Select-Object FullName, Length

      - name: Upload complete Windows test package
        uses: actions/upload-artifact@v4
        with:
          name: media-engine-test-package-windows-x64
          path: native-host/release/media-engine-test-package
          if-no-files-found: error
          retention-days: 7

      - name: Install staged package
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $EngineDir = Join-Path $PWD 'native-host\release\media-engine-test-package\engine'
          Push-Location $EngineDir
          try {
            ./install_host.ps1
          } finally {
            Pop-Location
          }

      - name: Smoke installed Native Host
        shell: powershell
        run: |
          $InstalledHost = Join-Path $env:LOCALAPPDATA 'ArzumanoffMediaEngine\media-engine-host.exe'
          python "$env:GITHUB_WORKSPACE\native-host\tests\smoke_built_host.py" $InstalledHost

      - name: Verify installed files and registry
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $RegistryPath = 'HKCU:\Software\Google\Chrome\NativeMessagingHosts\com.arzumanoff.media_engine'
          if (-not (Test-Path $RegistryPath)) { throw 'Native Messaging registry key was not created.' }
          foreach ($Name in @('media-engine-host.exe', 'ffmpeg.exe', 'ffprobe.exe', 'deno.exe', 'native-host.json')) {
            $Installed = Join-Path $env:LOCALAPPDATA "ArzumanoffMediaEngine\$Name"
            if (-not (Test-Path $Installed)) { throw "Installed component missing: $Installed" }
          }

      - name: Uninstall staged package
        if: always()
        shell: powershell
        run: ./native-host/release/media-engine-test-package/engine/uninstall_host.ps1
